[package]
name = "dashou-desktop"
version = "0.1.2-rc6"
description = "搭手 Dashou desktop launcher"
authors = ["Warmbyte"]
edition = "2021"

[lib]
name = "dashou_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
