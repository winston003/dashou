name: Dashou desktop

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run verify:pilot-release

  build-macos:
    needs: verify-source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-arm64.tgz
          DASHOU_CLOUDFLARED_SHA256: ae6ee90188ae5833c687ce937c3693e28403677607c06c65a2ff2b6a022f50e4
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-arm64.tgz
          DASHOU_CLOUDFLARED_SHA256: ae6ee90188ae5833c687ce937c3693e28403677607c06c65a2ff2b6a022f50e4
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build --prefix desktop -- --bundles app,dmg
      - name: Verify macOS bundle signature
        run: codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/Dashou.app
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-macos-arm64
          path: desktop/src-tauri/target/release/bundle/**

  build-macos-x64:
    needs: verify-source
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-amd64.tgz
          DASHOU_CLOUDFLARED_SHA256: 3f74d697045ecf56dd2fbeb42f59767ecdf4067c409d55f080563923e8a1bb32
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-amd64.tgz
          DASHOU_CLOUDFLARED_SHA256: 3f74d697045ecf56dd2fbeb42f59767ecdf4067c409d55f080563923e8a1bb32
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build --prefix desktop -- --bundles app,dmg
      - name: Verify macOS bundle signature
        run: codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/Dashou.app
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-macos-x64
          path: desktop/src-tauri/target/release/bundle/**

  build-windows:
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        shell: pwsh
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-windows-amd64.exe
          DASHOU_CLOUDFLARED_SHA256: 5253e66f1f493c4e13539749f1aa86fd0c61e3072900fec29a44ba046a6d97e2
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-windows-amd64.exe
          DASHOU_CLOUDFLARED_SHA256: 5253e66f1f493c4e13539749f1aa86fd0c61e3072900fec29a44ba046a6d97e2
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build --prefix desktop -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-windows
          path: desktop/src-tauri/target/release/bundle/**

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - build-macos
      - build-macos-x64
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@v4
        with:
          name: dashou-macos-arm64
          path: downloaded/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: dashou-macos-x64
          path: downloaded/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: dashou-windows
          path: downloaded/windows
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          mac_arm64_archive="$(find downloaded/macos-arm64 -type f -name 'Dashou.app.tar.gz' -print -quit)"
          mac_arm64_signature="${mac_arm64_archive}.sig"
          mac_arm64_dmg="$(find downloaded/macos-arm64 -type f -name '*.dmg' -print -quit)"
          mac_x64_archive="$(find downloaded/macos-x64 -type f -name 'Dashou.app.tar.gz' -print -quit)"
          mac_x64_signature="${mac_x64_archive}.sig"
          mac_x64_dmg="$(find downloaded/macos-x64 -type f -name '*.dmg' -print -quit)"
          windows_installer="$(find downloaded/windows -type f -name '*.exe' -print -quit)"
          windows_signature="${windows_installer}.sig"
          test -n "$mac_arm64_archive" -a -f "$mac_arm64_signature" -a -n "$mac_arm64_dmg"
          test -n "$mac_x64_archive" -a -f "$mac_x64_signature" -a -n "$mac_x64_dmg"
          test -n "$windows_installer" -a -f "$windows_signature"
          mkdir -p release-assets
          cp "$mac_arm64_archive" "release-assets/dashou-${version}-darwin-aarch64.app.tar.gz"
          cp "$mac_arm64_signature" "release-assets/dashou-${version}-darwin-aarch64.app.tar.gz.sig"
          cp "$mac_arm64_dmg" "release-assets/dashou-${version}-darwin-aarch64.dmg"
          cp "$mac_x64_archive" "release-assets/dashou-${version}-darwin-x86_64.app.tar.gz"
          cp "$mac_x64_signature" "release-assets/dashou-${version}-darwin-x86_64.app.tar.gz.sig"
          cp "$mac_x64_dmg" "release-assets/dashou-${version}-darwin-x86_64.dmg"
          cp "$windows_installer" "release-assets/dashou-${version}-windows-x86_64-setup.exe"
          cp "$windows_signature" "release-assets/dashou-${version}-windows-x86_64-setup.exe.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate Tauri updater manifest
        env:
          DASHOU_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DASHOU_RELEASE_BASE_URL: https://github.com/winston003/dashou-releases/releases/download/desktop-${{ steps.release.outputs.version }}
          DASHOU_MAC_ARM64_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-aarch64.app.tar.gz
          DASHOU_MAC_ARM64_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-aarch64.app.tar.gz.sig
          DASHOU_MAC_X64_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-x86_64.app.tar.gz
          DASHOU_MAC_X64_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-x86_64.app.tar.gz.sig
          DASHOU_WINDOWS_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-windows-x86_64-setup.exe
          DASHOU_WINDOWS_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-windows-x86_64-setup.exe.sig
          DASHOU_UPDATER_MANIFEST_PATH: release-assets/latest.json
        run: node desktop/scripts/create-updater-manifest.mjs
      - name: Require matching deployed control plane
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.release.outputs.version }}"
          actual="$(curl --fail --silent --show-error https://dashou-pilot-control.whilewon.workers.dev/healthz | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version||""))')"
          test "$actual" = "$expected"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: winston003/dashou-releases
          tag_name: desktop-${{ steps.release.outputs.version }}
          token: ${{ secrets.DASHOU_RELEASES_TOKEN }}
          generate_release_notes: true
          body: |
            ## 安装

            - Apple 芯片 Mac：下载 `darwin-aarch64.dmg`
            - Intel Mac：下载 `darwin-x86_64.dmg`
            - Windows 10/11：下载 `windows-x86_64-setup.exe`

            安装后打开搭手，点击“申请开通”，等待管理员同意；然后选择一个或多个工作文件夹，点击“开始使用”和“去 ChatGPT 连接”。用户无需填写公网地址、连接码或 Tunnel Token。

            如果 ChatGPT 授权页要求密码，回到搭手点击“复制授权密码”。
          files: release-assets/*
