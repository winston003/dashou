name: Dashou desktop

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Prepare Tauri resource directories
        run: mkdir -p desktop/vendor/node-runtime desktop/vendor/dashou-runtime desktop/vendor/cloudflared
      - run: npm run verify:pilot-release

  build-macos:
    needs: verify-source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Require Apple Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/dashou-developer-id.p12"
          keychain="$RUNNER_TEMP/dashou-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity" || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-arm64.tgz
          DASHOU_CLOUDFLARED_SHA256: ae6ee90188ae5833c687ce937c3693e28403677607c06c65a2ff2b6a022f50e4
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-arm64.tgz
          DASHOU_CLOUDFLARED_SHA256: ae6ee90188ae5833c687ce937c3693e28403677607c06c65a2ff2b6a022f50e4
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build --prefix desktop -- --bundles app,dmg
      - name: Verify Developer ID signature, notarization and stapling
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Dashou.app"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F "Authority=Developer ID Application:"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-macos-arm64
          path: desktop/src-tauri/target/release/bundle/**

  build-macos-x64:
    needs: verify-source
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Require Apple Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/dashou-developer-id.p12"
          keychain="$RUNNER_TEMP/dashou-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity" || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-amd64.tgz
          DASHOU_CLOUDFLARED_SHA256: 3f74d697045ecf56dd2fbeb42f59767ecdf4067c409d55f080563923e8a1bb32
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-darwin-amd64.tgz
          DASHOU_CLOUDFLARED_SHA256: 3f74d697045ecf56dd2fbeb42f59767ecdf4067c409d55f080563923e8a1bb32
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build --prefix desktop -- --bundles app,dmg
      - name: Verify Developer ID signature, notarization and stapling
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Dashou.app"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F "Authority=Developer ID Application:"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-macos-x64
          path: desktop/src-tauri/target/release/bundle/**

  build-windows:
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Prepare Tauri resource directories
        run: |
          node -e "for (const path of ['desktop/vendor/node-runtime', 'desktop/vendor/dashou-runtime', 'desktop/vendor/cloudflared']) require('node:fs').mkdirSync(path, { recursive: true })"
      - name: Compile and test Windows-specific desktop code
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Configure release keys
        env:
          DASHOU_UPDATER_PUBLIC_KEY: ${{ secrets.DASHOU_UPDATER_PUBLIC_KEY }}
        run: node desktop/scripts/configure-release.mjs
      - name: Stage reviewed cloudflared
        shell: pwsh
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-windows-amd64.exe
          DASHOU_CLOUDFLARED_SHA256: 5253e66f1f493c4e13539749f1aa86fd0c61e3072900fec29a44ba046a6d97e2
        run: npm run stage --prefix desktop
      - name: Build updater-signed installer
        env:
          DASHOU_CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.6.1/cloudflared-windows-amd64.exe
          DASHOU_CLOUDFLARED_SHA256: 5253e66f1f493c4e13539749f1aa86fd0c61e3072900fec29a44ba046a6d97e2
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DASHOU_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build --prefix desktop -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: dashou-windows
          path: desktop/src-tauri/target/release/bundle/**

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - build-macos
      - build-macos-x64
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@v4
        with:
          name: dashou-macos-arm64
          path: downloaded/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: dashou-macos-x64
          path: downloaded/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: dashou-windows
          path: downloaded/windows
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          mac_arm64_archive="$(find downloaded/macos-arm64 -type f -name 'Dashou.app.tar.gz' -print -quit)"
          mac_arm64_signature="${mac_arm64_archive}.sig"
          mac_arm64_dmg="$(find downloaded/macos-arm64 -type f -name '*.dmg' -print -quit)"
          mac_x64_archive="$(find downloaded/macos-x64 -type f -name 'Dashou.app.tar.gz' -print -quit)"
          mac_x64_signature="${mac_x64_archive}.sig"
          mac_x64_dmg="$(find downloaded/macos-x64 -type f -name '*.dmg' -print -quit)"
          windows_installer="$(find downloaded/windows -type f -name '*.exe' -print -quit)"
          windows_signature="${windows_installer}.sig"
          test -n "$mac_arm64_archive" -a -f "$mac_arm64_signature" -a -n "$mac_arm64_dmg"
          test -n "$mac_x64_archive" -a -f "$mac_x64_signature" -a -n "$mac_x64_dmg"
          test -n "$windows_installer" -a -f "$windows_signature"
          mkdir -p release-assets
          cp "$mac_arm64_archive" "release-assets/dashou-${version}-darwin-aarch64.app.tar.gz"
          cp "$mac_arm64_signature" "release-assets/dashou-${version}-darwin-aarch64.app.tar.gz.sig"
          cp "$mac_arm64_dmg" "release-assets/dashou-${version}-darwin-aarch64.dmg"
          cp "$mac_x64_archive" "release-assets/dashou-${version}-darwin-x86_64.app.tar.gz"
          cp "$mac_x64_signature" "release-assets/dashou-${version}-darwin-x86_64.app.tar.gz.sig"
          cp "$mac_x64_dmg" "release-assets/dashou-${version}-darwin-x86_64.dmg"
          cp "$windows_installer" "release-assets/dashou-${version}-windows-x86_64-setup.exe"
          cp "$windows_signature" "release-assets/dashou-${version}-windows-x86_64-setup.exe.sig"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate Tauri updater manifest
        env:
          DASHOU_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DASHOU_RELEASE_BASE_URL: https://github.com/winston003/dashou-releases/releases/download/desktop-${{ steps.release.outputs.version }}
          DASHOU_MAC_ARM64_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-aarch64.app.tar.gz
          DASHOU_MAC_ARM64_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-aarch64.app.tar.gz.sig
          DASHOU_MAC_X64_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-x86_64.app.tar.gz
          DASHOU_MAC_X64_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-darwin-x86_64.app.tar.gz.sig
          DASHOU_WINDOWS_ARCHIVE: release-assets/dashou-${{ steps.release.outputs.version }}-windows-x86_64-setup.exe
          DASHOU_WINDOWS_SIGNATURE: release-assets/dashou-${{ steps.release.outputs.version }}-windows-x86_64-setup.exe.sig
          DASHOU_UPDATER_MANIFEST_PATH: release-assets/latest.json
        run: node desktop/scripts/create-updater-manifest.mjs
      - name: Require matching deployed control plane
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.release.outputs.version }}"
          actual="$(curl --fail --silent --show-error https://dashou-pilot-control.whilewon.workers.dev/healthz | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version||""))')"
          test "$actual" = "$expected"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: winston003/dashou-releases
          tag_name: desktop-${{ steps.release.outputs.version }}
          token: ${{ secrets.DASHOU_RELEASES_TOKEN }}
          generate_release_notes: true
          body: |
            ## 下载

            - [Mac Apple Silicon](https://github.com/winston003/dashou-releases/releases/download/desktop-${{ steps.release.outputs.version }}/dashou-${{ steps.release.outputs.version }}-darwin-aarch64.dmg)
            - [Mac Intel](https://github.com/winston003/dashou-releases/releases/download/desktop-${{ steps.release.outputs.version }}/dashou-${{ steps.release.outputs.version }}-darwin-x86_64.dmg)
            - [Windows](https://github.com/winston003/dashou-releases/releases/download/desktop-${{ steps.release.outputs.version }}/dashou-${{ steps.release.outputs.version }}-windows-x86_64-setup.exe)

            ## 5 分钟开始使用

            1. 安装并打开搭手，点击“加入试用”。
            2. 搭手准备好后，点击“添加文件夹”，选择一个或多个工作文件夹，再点击“开始使用”。
            3. 点击“去 ChatGPT 连接”。搭手会自动复制地址并打开 ChatGPT。
            4. 在 ChatGPT“个人”页点击“创建应用”，粘贴地址；需要密码时回到搭手点击“复制授权密码”。

            [打开 ChatGPT 插件页](https://chatgpt.com/plugins?view=personal)

            ![搭手首次设置](https://raw.githubusercontent.com/winston003/dashou/${{ github.ref_name }}/docs/images/first-setup.jpg)

            ![搭手已准备好](https://raw.githubusercontent.com/winston003/dashou/${{ github.ref_name }}/docs/images/ready-to-connect.jpg)

            如果看不到“创建应用”：打开 ChatGPT **设置 → 应用（Apps）→ 高级设置（Advanced settings）→ 开发者模式（Developer mode）**；工作区管理员可从 **工作区设置（Workspace settings）→ 应用（Apps）→ 创建（Create）** 进入。

            官方说明：[Developer mode and MCP apps in ChatGPT](https://help.openai.com/en/articles/12584461-developer-mode-and-full-mcp-connectors-in-chatgpt)

            关闭窗口只会把搭手收起到 macOS 顶部菜单栏，不会停止本地服务。需要停止服务时，在菜单栏选择“退出搭手”。

            ## 最近变化

            - 修复 Windows 正式版启动时弹出黑色控制台窗口的问题。
            - 准备失败时可直接复制隐私安全的排查信息给客服。
            - 支持选择多个工作文件夹。
            - 关闭窗口后继续驻留菜单栏，只有选择“退出搭手”才停止服务。
            - 安装包内置 Node.js 和 `cloudflared`，用户不需要另行安装。

            完整图文说明：[GETTING_STARTED.md](https://github.com/winston003/dashou/blob/${{ github.ref_name }}/docs/GETTING_STARTED.md)
          files: release-assets/*
